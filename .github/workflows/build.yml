name: Build Kotlin Android App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Auto Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Create Default Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Make Gradlew Executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Build APK with Gradle
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.daemon=false -Dksp.incremental=false"
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --info
          else
            gradle assembleDebug --no-daemon --info
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
